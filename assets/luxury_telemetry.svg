<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>

    <linearGradient id="goldCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e929f" />
      <stop offset="45%" stop-color="#e5c07b" />
      <stop offset="100%" stop-color="#f6d365" />
    </linearGradient>

    <linearGradient id="greySwatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#696d77" />
      <stop offset="100%" stop-color="#474b54" />
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; }
      .font-mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; }
      
      @keyframes softPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.35; }
      }
      @keyframes eqPulse1 { 0%, 100% { height: 18px; y: 32px; } 50% { height: 44px; y: 6px; } }
      @keyframes eqPulse2 { 0%, 100% { height: 38px; y: 12px; } 50% { height: 20px; y: 30px; } }
      @keyframes eqPulse3 { 0%, 100% { height: 48px; y: 2px; } 50% { height: 26px; y: 24px; } }
      @keyframes eqPulse4 { 0%, 100% { height: 24px; y: 26px; } 50% { height: 42px; y: 8px; } }
      @keyframes eqPulse5 { 0%, 100% { height: 32px; y: 18px; } 50% { height: 16px; y: 34px; } }

      .p-1 { animation: eqPulse1 1.6s ease-in-out infinite; }
      .p-2 { animation: eqPulse2 1.3s ease-in-out infinite; }
      .p-3 { animation: eqPulse3 1.8s ease-in-out infinite; }
      .p-4 { animation: eqPulse4 1.4s ease-in-out infinite; }
      .p-5 { animation: eqPulse5 1.1s ease-in-out infinite; }
      .pulse-beacon { animation: softPulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Left Card: Mavrick 440 Force Grey Telemetry -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="448" height="224" rx="10" fill="url(#tileBg)" stroke="#1a1c26" stroke-width="1.2" />
    
    <!-- Header Ledger -->
    <g transform="translate(24, 28)">
      <circle cx="4" cy="4" r="3.5" fill="#e5c07b" class="pulse-beacon" />
      <text x="16" y="7" fill="#8e929f" font-size="9" class="font-mono" letter-spacing="2">01 // MECHANICAL ARCHITECTURE</text>
      <text x="0" y="32" fill="#f8fafc" font-size="20" class="font-sans" font-weight="700">Mavrick 440</text>
      <text x="135" y="32" fill="#8e929f" font-size="12" class="font-mono" font-weight="400">/ Force Grey Edition</text>
    </g>

    <!-- Swatch Tag & Details -->
    <g transform="translate(24, 82)">
      <!-- Matte Force Grey Swatch Pill -->
      <rect x="0" y="0" width="10" height="10" rx="2" fill="url(#greySwatch)" stroke="#8e929f" stroke-width="0.5" />
      <text x="16" y="9" fill="#cbd5e1" font-size="10" class="font-mono">FINISH: FORCE GREY (MATTE GRAPHITE)</text>

      <text x="0" y="30" fill="#8e929f" font-size="11" class="font-mono">ENGINE: 440cc TorqX Air/Oil-Cooled Single</text>
      <text x="0" y="48" fill="#8e929f" font-size="11" class="font-mono">OUTPUT: 36 Nm Peak Torque @ 4,000 RPM</text>
      <text x="0" y="66" fill="#e5c07b" font-size="10.5" class="font-mono">ROLE: Western Ghats mental defragmentation</text>
    </g>

    <!-- Torque Curve Minimalist Vector Graphic -->
    <g transform="translate(260, 100)">
      <path d="M 0 50 Q 55 10 110 5 Q 145 2 165 15" fill="none" stroke="url(#goldCurve)" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="50" x2="165" y2="50" stroke="#1f2335" stroke-width="0.8" />
      <text x="110" y="0" text-anchor="middle" fill="#e5c07b" font-size="9" class="font-mono">36 Nm PEAK</text>
      <text x="165" y="46" text-anchor="end" fill="#585c6a" font-size="8.5" class="font-mono">6000 RPM</text>
    </g>

    <!-- Bottom border subtle accent -->
    <line x1="24" y1="206" x2="424" y2="206" stroke="#1a1d26" stroke-width="0.8" />
    <text x="24" y="218" fill="#3a3e4e" font-size="8.5" class="font-mono">CHASSIS: STEEL TRELLIS // TRANSMISSION: 6-SPEED ASSIST</text>
  </g>

  <!-- Right Card: Bansuri 432Hz Acoustics & 24fps Cinema -->
  <g transform="translate(470, 0)">
    <rect x="2" y="2" width="448" height="224" rx="10" fill="url(#tileBg)" stroke="#1a1d26" stroke-width="1.2" />
    
    <!-- Header Ledger -->
    <g transform="translate(24, 28)">
      <circle cx="4" cy="4" r="3.5" fill="#7aa2f7" class="pulse-beacon" />
      <text x="16" y="7" fill="#8e929f" font-size="9" class="font-mono" letter-spacing="2">02 // ACOUSTIC &amp; CELLULOID</text>
      <text x="0" y="32" fill="#f8fafc" font-size="20" class="font-sans" font-weight="700">Bansuri &amp; Cinema</text>
      <text x="180" y="32" fill="#8e929f" font-size="12" class="font-mono" font-weight="400">/ 432 Hz &amp; 24fps</text>
    </g>

    <!-- Details Column -->
    <g transform="translate(24, 82)">
      <text x="0" y="10" fill="#cbd5e1" font-size="10" class="font-mono">INSTRUMENT: 7-Hole Indian Bamboo Bansuri</text>
      <text x="0" y="30" fill="#8e929f" font-size="11" class="font-mono">TUNING: E-Bass / F-Bass Concert Scale</text>
      <text x="0" y="48" fill="#8e929f" font-size="11" class="font-mono">DISCIPLINE: Microtonal Ragas (Bhimpalasi, Yaman)</text>
      <text x="0" y="66" fill="#7aa2f7" font-size="10.5" class="font-mono">CINEMA: 24fps Visual Composition &amp; Lighting</text>
    </g>

    <!-- Minimalist Equalizer Audio Bars -->
    <g transform="translate(340, 95)">
      <rect x="0" y="20" width="7" height="30" rx="3.5" fill="#1f2335" />
      <rect x="0" y="20" width="7" height="30" rx="3.5" fill="#7aa2f7" class="p-1" />

      <rect x="14" y="15" width="7" height="35" rx="3.5" fill="#1f2335" />
      <rect x="14" y="15" width="7" height="35" rx="3.5" fill="#bb9af7" class="p-2" />

      <rect x="28" y="5" width="7" height="45" rx="3.5" fill="#1f2335" />
      <rect x="28" y="5" width="7" height="45" rx="3.5" fill="#e5c07b" class="p-3" />

      <rect x="42" y="12" width="7" height="38" rx="3.5" fill="#1f2335" />
      <rect x="42" y="12" width="7" height="38" rx="3.5" fill="#7aa2f7" class="p-4" />

      <rect x="56" y="22" width="7" height="28" rx="3.5" fill="#1f2335" />
      <rect x="56" y="22" width="7" height="28" rx="3.5" fill="#8e929f" class="p-5" />

      <text x="31" y="62" text-anchor="middle" fill="#585c6a" font-size="8.5" class="font-mono">432 Hz</text>
    </g>

    <!-- Bottom border subtle accent -->
    <line x1="24" y1="206" x2="424" y2="206" stroke="#1a1d26" stroke-width="0.8" />
    <text x="24" y="218" fill="#3a3e4e" font-size="8.5" class="font-mono">SOCIAL IMPACT: VOLUNTEER &amp; MENTOR AT U&amp;I NGO</text>
  </g>
</svg>
