<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#120c1f" />
      <stop offset="100%" stop-color="#2a1138" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="neonRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1138" />
      <stop offset="100%" stop-color="#06060c" />
    </linearGradient>

    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-arcade { font-family: 'Press Start 2P', 'Courier New', monospace; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      
      @keyframes roadScroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
      @keyframes bikeBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes obstacleMove {
        0% { transform: translateX(500px) scale(0.6); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateX(-500px) scale(1.1); opacity: 0; }
      }
      @keyframes blinkText {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes sunRays {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.5; }
      }

      .road-lines { animation: roadScroll 0.4s linear infinite; }
      .bike { animation: bikeBounce 0.25s ease-in-out infinite; }
      .obstacle-1 { animation: obstacleMove 3.2s linear infinite; }
      .obstacle-2 { animation: obstacleMove 3.2s linear infinite 1.6s; }
      .blink { animation: blinkText 0.9s steps(1) infinite; }
      .sun { animation: sunRays 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Arcade Cabinet Screen Frame -->
  <rect x="2" y="2" width="916" height="316" rx="14" fill="#030306" stroke="#222533" stroke-width="2" />

  <!-- Retro Cyberpunk Horizon Sky -->
  <rect x="10" y="10" width="900" height="170" fill="url(#skyGrad)" rx="8" />

  <!-- Retro Synthwave Sun -->
  <g transform="translate(460, 110)" class="sun">
    <circle cx="0" cy="0" r="54" fill="url(#sunGrad)" filter="url(#neonGlow)" />
    <!-- Horizontal scan cuts in sun -->
    <rect x="-56" y="2" width="112" height="4" fill="#120c1f" />
    <rect x="-56" y="14" width="112" height="6" fill="#120c1f" />
    <rect x="-56" y="28" width="112" height="8" fill="#120c1f" />
    <rect x="-56" y="42" width="112" height="12" fill="#120c1f" />
  </g>

  <!-- Distant Wireframe Mountains -->
  <polygon points="10,180 120,130 240,180 340,140 460,180 580,135 680,180 820,125 910,180" fill="none" stroke="#ff758c" stroke-width="1.2" opacity="0.4" />

  <!-- Retro Grid Highway (Perspective Ground) -->
  <g transform="translate(10, 180)">
    <rect x="0" y="0" width="900" height="130" fill="url(#neonRoad)" />

    <!-- Perspective Grid Lines -->
    <line x1="450" y1="0" x2="0" y2="130" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
    <line x1="450" y1="0" x2="160" y2="130" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    <line x1="450" y1="0" x2="320" y2="130" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="450" y1="0" x2="450" y2="130" stroke="#ff007f" stroke-width="2" opacity="0.8" />
    <line x1="450" y1="0" x2="580" y2="130" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="450" y1="0" x2="740" y2="130" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    <line x1="450" y1="0" x2="900" y2="130" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />

    <!-- Animated Horizontal Crosslines -->
    <line x1="0" y1="20" x2="900" y2="20" stroke="#00f2fe" stroke-width="0.8" opacity="0.3" />
    <line x1="0" y1="45" x2="900" y2="45" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="75" x2="900" y2="75" stroke="#00f2fe" stroke-width="1.2" opacity="0.6" />
    <line x1="0" y1="110" x2="900" y2="110" stroke="#00f2fe" stroke-width="1.6" opacity="0.8" />
  </g>

  <!-- Obstacle 1: 74% ATTENDANCE (Incoming Bug) -->
  <g class="obstacle-1" transform="translate(450, 220)">
    <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#1b0a14" stroke="#ff007f" stroke-width="1.5" filter="url(#neonGlow)" />
    <text x="0" y="5" text-anchor="middle" fill="#ff758c" font-size="11" class="font-mono" font-weight="700">⚠️ 74.9% ATTENDANCE</text>
  </g>

  <!-- Obstacle 2: SEGFAULT (Incoming Bug) -->
  <g class="obstacle-2" transform="translate(450, 220)">
    <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#081726" stroke="#00f2fe" stroke-width="1.5" filter="url(#neonGlow)" />
    <text x="0" y="5" text-anchor="middle" fill="#00f2fe" font-size="11" class="font-mono" font-weight="700">👾 SEGFAULT_404</text>
  </g>

  <!-- PLAYER VEHICLE: ROYAL ENFIELD SCRAM 440 (FORCE GREY) -->
  <g transform="translate(260, 245)" class="bike">
    <!-- Wheels -->
    <circle cx="20" cy="25" r="16" fill="#08080c" stroke="#575b63" stroke-width="4" />
    <circle cx="20" cy="25" r="8" fill="#181b22" stroke="#e5c07b" stroke-width="1.5" />

    <circle cx="85" cy="25" r="16" fill="#08080c" stroke="#575b63" stroke-width="4" />
    <circle cx="85" cy="25" r="8" fill="#181b22" stroke="#e5c07b" stroke-width="1.5" />

    <!-- Exhaust Pipe with Heat Glow -->
    <path d="M 40 22 L 72 26 L 98 22" fill="none" stroke="#8e929f" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="102" cy="22" r="3" fill="#ff758c" filter="url(#neonGlow)" />

    <!-- Engine: 440cc TorqX Thumper -->
    <rect x="36" y="8" width="26" height="20" rx="3" fill="#1f232d" stroke="#575b63" stroke-width="1.5" />
    <!-- Cooling Fins -->
    <line x1="38" y1="12" x2="60" y2="12" stroke="#8e929f" stroke-width="1" />
    <line x1="38" y1="16" x2="60" y2="16" stroke="#8e929f" stroke-width="1" />
    <line x1="38" y1="20" x2="60" y2="20" stroke="#8e929f" stroke-width="1" />

    <!-- Scram 440 Fuel Tank (FORCE GREY) -->
    <path d="M 32 6 Q 48 -6 68 4 L 56 12 L 32 10 Z" fill="#575b63" stroke="#8e929f" stroke-width="1.2" />
    <!-- Gold / Yellow Scram Decal Stripe -->
    <path d="M 42 3 Q 54 -1 64 6" fill="none" stroke="#e5c07b" stroke-width="1.5" />

    <!-- Seat & Tail -->
    <path d="M 20 8 Q 28 6 36 8 L 34 12 L 20 12 Z" fill="#121318" />

    <!-- Handlebars & Headlamp -->
    <line x1="64" y1="4" x2="72" y2="-6" stroke="#8e929f" stroke-width="2" />
    <circle cx="82" cy="-2" r="5" fill="#f8fafc" filter="url(#neonGlow)" />

    <!-- Headlight Beam onto Road -->
    <polygon points="87,-2 280,-20 280,30" fill="url(#laserCyan)" opacity="0.2" />

    <!-- Rider: Prajwal (Minimalist Silhouette) -->
    <!-- Helmet -->
    <circle cx="48" cy="-14" r="9" fill="#181b22" stroke="#ff758c" stroke-width="1" />
    <!-- Visor -->
    <path d="M 52 -16 Q 57 -14 55 -10" stroke="#00f2fe" stroke-width="2" fill="none" />
    <!-- Jacket / Lean -->
    <path d="M 44 -5 L 36 8 L 52 8 L 60 -2 Z" fill="#242838" />
    <!-- Arms reaching handlebar -->
    <line x1="48" y1="-2" x2="70" y2="-5" stroke="#242838" stroke-width="3" stroke-linecap="round" />

    <!-- Flute Case strapped to back -->
    <line x1="34" y1="12" x2="60" y2="-18" stroke="#e5c07b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Vehicle Tag -->
    <text x="52" y="50" text-anchor="middle" fill="#e5c07b" font-size="9" class="font-mono" font-weight="700">RE SCRAM 440 // FORCE GREY</text>
  </g>

  <!-- TOP ARCADE HUD BAR -->
  <g transform="translate(24, 30)">
    <rect x="0" y="0" width="872" height="32" rx="6" fill="#08090f" stroke="#1f2334" stroke-width="1" />
    <text x="16" y="20" fill="#00f2fe" font-size="11" class="font-mono" font-weight="700">1P: PRAJWAL</text>
    <text x="140" y="20" fill="#ff758c" font-size="11" class="font-mono" font-weight="700">SCORE: 044000</text>
    <text x="310" y="20" fill="#e5c07b" font-size="11" class="font-mono" font-weight="700">GEAR: 5 [80 KM/H]</text>
    <text x="500" y="20" fill="#cbd5e1" font-size="11" class="font-mono">MAP: MYSURU ➔ WESTERN GHATS</text>
    <text x="760" y="20" fill="#9ece6a" font-size="11" class="font-mono" font-weight="700">LIVES: ♥ ♥ ♥</text>
  </g>

  <!-- BOTTOM ARCADE TICKER -->
  <g transform="translate(460, 298)">
    <text x="0" y="0" text-anchor="middle" fill="#00f2fe" font-size="11" class="font-mono blink" font-weight="700" letter-spacing="2">
      ▼ SCROLL DOWN TO PLAY: "THE 74.9% ATTENDANCE HEIST" ▼
    </text>
  </g>
</svg>
