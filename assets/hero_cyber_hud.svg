<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>

    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="45%" stop-color="#7aa2f7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="1" />
      <stop offset="55%" stop-color="#bb9af7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.97); }
      }
      @keyframes scanline {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }
      @keyframes laserMove {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      @keyframes blinkLed {
        0%, 100% { fill: #9ece6a; }
        50% { fill: #41a6b5; }
      }
      @keyframes blinkOrange {
        0%, 100% { fill: #e0af68; }
        50% { fill: #f7768e; }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .laser { animation: laserMove 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .led-green { animation: blinkLed 1.8s ease-in-out infinite; }
      .led-orange { animation: blinkOrange 2.2s ease-in-out infinite; }
      .pulsing-box { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" stroke="#24283b" stroke-width="1.5" />

  <!-- Cyberpunk Matrix Grid Background (Subtle) -->
  <g opacity="0.07" stroke="#7aa2f7" stroke-width="0.75">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="280" x2="900" y2="280" />
    <line x1="60" y1="0" x2="60" y2="320" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="260" y1="0" x2="260" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="460" y1="0" x2="460" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="660" y1="0" x2="660" y2="320" />
    <line x1="760" y1="0" x2="760" y2="320" />
    <line x1="860" y1="0" x2="860" y2="320" />
  </g>

  <!-- Top Terminal Header Bar -->
  <path d="M 2 18 Q 2 2 18 2 L 882 2 Q 898 2 898 18 L 898 38 L 2 38 Z" fill="#141724" />
  <circle cx="24" cy="20" r="5" fill="#f7768e" />
  <circle cx="40" cy="20" r="5" fill="#e0af68" />
  <circle cx="56" cy="20" r="5" fill="#9ece6a" />

  <!-- Terminal Title & Status -->
  <text x="80" y="24" fill="#a9b1d6" font-size="12" class="font-mono" font-weight="600" letter-spacing="1">
    ROOT@PRAJWAL-VARMA // SCRAM-411_CORE_v2.4
  </text>
  <rect x="670" y="11" width="210" height="18" rx="9" fill="#1a1d2d" stroke="#2e3440" stroke-width="1" />
  <circle cx="682" cy="20" r="4" class="led-green" />
  <text x="694" y="23" fill="#9ece6a" font-size="10.5" class="font-mono" font-weight="700">STATUS: OVERCLOCKING [LIVE]</text>

  <!-- Laser Sweep Line -->
  <g filter="url(#laserGlow)">
    <rect x="0" y="38" width="900" height="2" fill="url(#laserGrad)" class="laser" />
  </g>

  <!-- Left Column: Main Identity -->
  <g transform="translate(36, 68)">
    <!-- Small Category Tag -->
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#1f2335" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.4" />
    <text x="10" y="15" fill="#7dcfff" font-size="10.5" class="font-mono" font-weight="700" letter-spacing="1.5">⚡ AUTONOMOUS HACKER</text>

    <!-- Main Title -->
    <text x="0" y="62" fill="url(#neonBlue)" font-size="38" class="font-sans" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      PRAJWAL VARMA
    </text>

    <!-- Subtitle Role -->
    <text x="0" y="86" fill="#f8f8f2" font-size="14.5" class="font-mono" font-weight="600" letter-spacing="0.5">
      AI &amp; ML Engineer <tspan fill="#bb9af7">|</tspan> Reverse Engineering <tspan fill="#bb9af7">|</tspan> Full-Stack
    </text>

    <!-- Campus & Department -->
    <text x="0" y="108" fill="#7aa2f7" font-size="12" class="font-mono" opacity="0.9">
      🏛️ Vidyavardhaka College of Engineering (VVCE) • Mysuru, IN
    </text>

    <!-- Punchy Philosophy Box -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="460" height="48" rx="8" fill="#161824" stroke="#24283b" stroke-width="1" />
      <text x="14" y="21" fill="#e0af68" font-size="11.5" class="font-mono" font-weight="700">
        &gt; "The compiler is my enemy.
      </text>
      <text x="28" y="38" fill="#a9b1d6" font-size="11.5" class="font-mono">
        Torturing my laptop with chaotic Python &amp; AI."
      </text>
    </g>

    <!-- Coordinates Tag -->
    <text x="2" y="194" fill="#565f89" font-size="10" class="font-mono">
      GEO_LOCK: 12.3052° N, 76.6552° E • MYSURU_HQ • 24fps
    </text>
  </g>

  <!-- Right Column: Interactive Telemetry HUD Cards -->
  <g transform="translate(535, 62)">
    <!-- HUD Card 1: RE Scram 411 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="330" height="52" rx="8" fill="#161927" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="18" cy="26" r="5" class="led-orange" />
      <text x="32" y="20" fill="#f8f8f2" font-size="11.5" class="font-mono" font-weight="700">MOTORCYCLE: RE SCRAM 411</text>
      <text x="32" y="38" fill="#7aa2f7" font-size="10.5" class="font-mono">411cc Single-Cyl • Outrunning Bugs at 80km/h</text>
      <!-- Small RPM Bar -->
      <rect x="235" y="14" width="80" height="6" rx="3" fill="#24283b" />
      <rect x="235" y="14" width="65" height="6" rx="3" fill="url(#neonBlue)" />
    </g>

    <!-- HUD Card 2: Bansuri / Flute Frequency -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="330" height="52" rx="8" fill="#161927" stroke="#bb9af7" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="18" cy="26" r="5" fill="#bb9af7" />
      <text x="32" y="20" fill="#f8f8f2" font-size="11.5" class="font-mono" font-weight="700">ACOUSTIC FREQUENCY: BANSURI</text>
      <text x="32" y="38" fill="#bb9af7" font-size="10.5" class="font-mono">Classical Indian Bamboo Flute • 432Hz Soul Reset</text>
      <!-- Soundwave animation bars -->
      <g transform="translate(260, 26)">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" />
        <line x1="6" y1="-14" x2="6" y2="14" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="-5" x2="12" y2="5" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" />
        <line x1="18" y1="-11" x2="18" y2="11" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" />
        <line x1="24" y1="-7" x2="24" y2="7" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- HUD Card 3: DaddyIon Exploit / Reverse Engineering -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="330" height="52" rx="8" fill="#161927" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="18" cy="26" r="5" class="led-green" />
      <text x="32" y="20" fill="#f8f8f2" font-size="11.5" class="font-mono" font-weight="700">CROWN EXPLOIT: DADDYION</text>
      <text x="32" y="38" fill="#9ece6a" font-size="10.5" class="font-mono">Reverse-Engineered IonCUDOS • Autonomous Client</text>
      <!-- Shield/Unlock icon -->
      <text x="290" y="32" font-size="16">🔓</text>
    </g>

    <!-- HUD Card 4: Cinema & U&I -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="330" height="52" rx="8" fill="#161927" stroke="#e0af68" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="18" cy="26" r="5" fill="#e0af68" />
      <text x="32" y="20" fill="#f8f8f2" font-size="11.5" class="font-mono" font-weight="700">CINEMA &amp; IMPACT: 24FPS + U&amp;I</text>
      <text x="32" y="38" fill="#e0af68" font-size="10.5" class="font-mono">Indie Filmmaker • Mentoring Street Children</text>
      <text x="290" y="32" font-size="16">🎬</text>
    </g>
  </g>

  <!-- Bottom Accent Edge -->
  <line x1="0" y1="318" x2="900" y2="318" stroke="url(#neonBlue)" stroke-width="2" />
</svg>
