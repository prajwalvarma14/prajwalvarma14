<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1018" />
      <stop offset="100%" stop-color="#141726" />
    </linearGradient>

    <linearGradient id="orangeBurn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e3b" />
      <stop offset="100%" stop-color="#ff5370" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <filter id="gaugeGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif; }
      @keyframes eq1 { 0%, 100% { height: 12px; y: 44px; } 50% { height: 38px; y: 18px; } }
      @keyframes eq2 { 0%, 100% { height: 32px; y: 24px; } 50% { height: 16px; y: 40px; } }
      @keyframes eq3 { 0%, 100% { height: 42px; y: 14px; } 50% { height: 20px; y: 36px; } }
      @keyframes eq4 { 0%, 100% { height: 18px; y: 38px; } 50% { height: 46px; y: 10px; } }
      @keyframes eq5 { 0%, 100% { height: 26px; y: 30px; } 50% { height: 14px; y: 42px; } }
      @keyframes needleWobble {
        0%, 100% { transform: rotate(45deg); }
        35% { transform: rotate(58deg); }
        70% { transform: rotate(42deg); }
      }
      .eq-b1 { animation: eq1 1.2s ease-in-out infinite; }
      .eq-b2 { animation: eq2 0.9s ease-in-out infinite; }
      .eq-b3 { animation: eq3 1.4s ease-in-out infinite; }
      .eq-b4 { animation: eq4 1.1s ease-in-out infinite; }
      .eq-b5 { animation: eq5 0.8s ease-in-out infinite; }
      .needle { transform-origin: 105px 125px; animation: needleWobble 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Panel 1: RE Scram 411 Machine Telemetry (Left) -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="438" height="236" rx="14" fill="url(#cardBg)" stroke="#272d42" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="18" y="16" width="130" height="20" rx="4" fill="#241b1d" stroke="#ff5370" stroke-width="0.8" />
    <text x="26" y="30" fill="#ff757f" font-size="10.5" class="font-mono" font-weight="700">🏍️ THE 411cc CHASSIS</text>
    <text x="160" y="30" fill="#a9b1d6" font-size="11" class="font-mono">ROYAL ENFIELD SCRAM</text>

    <!-- Tachometer / Speed Gauge Simulation -->
    <g transform="translate(20, 48)">
      <!-- Outer Dial Arc -->
      <path d="M 45 135 A 65 65 0 1 1 165 135" fill="none" stroke="#1f2335" stroke-width="12" stroke-linecap="round" />
      <path d="M 45 135 A 65 65 0 0 1 145 75" fill="none" stroke="url(#orangeBurn)" stroke-width="12" stroke-linecap="round" filter="url(#gaugeGlow)" />
      
      <!-- Needle -->
      <circle cx="105" cy="125" r="7" fill="#ff5370" />
      <line x1="105" y1="125" x2="60" y2="70" stroke="#f7768e" stroke-width="3" stroke-linecap="round" class="needle" />

      <!-- Speed readout in center -->
      <text x="105" y="112" text-anchor="middle" fill="#f8f8f2" font-size="20" class="font-mono" font-weight="800">411</text>
      <text x="105" y="125" text-anchor="middle" fill="#ff9e3b" font-size="8" class="font-mono" font-weight="700">CC / LS410</text>
    </g>

    <!-- Telemetry Metrics List -->
    <g transform="translate(200, 60)">
      <text x="0" y="16" fill="#f8f8f2" font-size="12" class="font-mono" font-weight="700">STATE: THROTTLE OPEN</text>
      <text x="0" y="36" fill="#7aa2f7" font-size="11" class="font-mono">GEAR: 5th (Cruising speed)</text>
      <text x="0" y="56" fill="#a9b1d6" font-size="11" class="font-mono">TERRAIN: Karnataka Highways</text>
      <text x="0" y="76" fill="#9ece6a" font-size="11" class="font-mono">PURPOSE: Segfault Eraser</text>
      <text x="0" y="100" fill="#565f89" font-size="10" class="font-mono">"No compiler warnings at 80 km/h"</text>
    </g>

    <!-- Bottom Line -->
    <line x1="18" y1="218" x2="422" y2="218" stroke="#ff9e3b" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Panel 2: Bansuri Acoustics & 24fps Cinema (Right) -->
  <g transform="translate(460, 0)">
    <rect x="2" y="2" width="438" height="236" rx="14" fill="url(#cardBg)" stroke="#272d42" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="18" y="16" width="138" height="20" rx="4" fill="#1b2038" stroke="#7aa2f7" stroke-width="0.8" />
    <text x="26" y="30" fill="#7dcfff" font-size="10.5" class="font-mono" font-weight="700">🪈 ACOUSTIC HARMONICS</text>
    <text x="168" y="30" fill="#bb9af7" font-size="11" class="font-mono">BANSURI &amp; 24FPS FILM</text>

    <!-- Animated Equalizer Bars for Flute Ragas -->
    <g transform="translate(30, 70)">
      <rect x="0" y="20" width="8" height="30" rx="4" fill="#7aa2f7" class="eq-b1" />
      <rect x="14" y="24" width="8" height="26" rx="4" fill="#bb9af7" class="eq-b2" />
      <rect x="28" y="14" width="8" height="36" rx="4" fill="#7dcfff" class="eq-b3" />
      <rect x="42" y="30" width="8" height="20" rx="4" fill="#9ece6a" class="eq-b4" />
      <rect x="56" y="22" width="8" height="28" rx="4" fill="#bb9af7" class="eq-b5" />
      <rect x="70" y="16" width="8" height="34" rx="4" fill="#7aa2f7" class="eq-b1" />
      <rect x="84" y="28" width="8" height="22" rx="4" fill="#7dcfff" class="eq-b2" />
      <rect x="98" y="18" width="8" height="32" rx="4" fill="#bb9af7" class="eq-b3" />
      
      <!-- Flute Annotation -->
      <text x="54" y="75" text-anchor="middle" fill="#bb9af7" font-size="9" class="font-mono">432 Hz RAGA SCALE</text>
    </g>

    <!-- Cinema & Narrative Column -->
    <g transform="translate(165, 60)">
      <text x="0" y="16" fill="#f8f8f2" font-size="12" class="font-mono" font-weight="700">CINEMA: 24 FRAMES / SEC</text>
      <text x="0" y="36" fill="#e0af68" font-size="11" class="font-mono">PASSION: Short Film Director</text>
      <text x="0" y="56" fill="#7aa2f7" font-size="11" class="font-mono">STYLE: High Contrast &amp; Depth</text>
      <text x="0" y="76" fill="#9ece6a" font-size="11" class="font-mono">CAUSE: U&amp;I NGO Mentor</text>
      <text x="0" y="100" fill="#565f89" font-size="10" class="font-mono">"Storytelling in code and on celluloid"</text>
    </g>

    <!-- Film Sprocket Decorative Border -->
    <g opacity="0.3" transform="translate(20, 192)">
      <rect x="0" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="18" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="36" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="54" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="72" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="90" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="108" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
      <rect x="126" y="0" width="12" height="8" rx="1.5" fill="#a9b1d6" />
    </g>

    <line x1="18" y1="218" x2="422" y2="218" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.3" />
  </g>
</svg>
